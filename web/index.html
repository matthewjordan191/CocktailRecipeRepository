<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cocktail Recipes</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <meta name="theme-color" content="#111111" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <nav id="main-nav">
    <button class="nav-btn active" data-view="list">Browse</button>
    <button class="nav-btn" data-view="bar">My Bar</button>
  </nav>

  <!-- Browse view -->
  <div id="view-list">
    <header>
      <h1>Cocktails</h1>
      <p class="subtitle" id="count"></p>
    </header>
    <main>
      <input id="search" type="search" placeholder="Search cocktails…"
             autocomplete="off" autocorrect="off" spellcheck="false" />
      <div id="filter-bar" role="group" aria-label="Filter by category"></div>
      <div id="all-tags-panel" hidden></div>
      <ul id="cocktail-list"></ul>
      <p id="error" hidden></p>
    </main>
  </div>

  <!-- My Bar view -->
  <div id="view-bar" hidden>
    <header>
      <h1>My Bar</h1>
      <p class="subtitle" id="bar-subtitle">Check off what you have</p>
    </header>
    <main>
      <input id="ing-search" type="search" placeholder="Search ingredients…"
             autocomplete="off" autocorrect="off" spellcheck="false" />
      <ul id="ing-list"></ul>
    </main>
  </div>

  <!-- Detail view -->
  <div id="view-detail" hidden>
    <header>
      <div class="detail-header-row">
        <button id="back-btn" aria-label="Back">&#8592; Back</button>
        <button id="fav-btn" aria-label="Favourite">&#9734;</button>
      </div>
      <h2 id="detail-name"></h2>
      <div id="detail-meta"></div>
    </header>
    <main>
      <img id="detail-img" hidden alt="" />
      <section id="detail-ingredients">
        <h3>Ingredients</h3>
        <ul id="ingredient-list"></ul>
      </section>
      <section id="detail-garnish" hidden>
        <h3>Garnish</h3>
        <p id="garnish-text"></p>
      </section>
      <section id="detail-instructions" hidden>
        <h3>Instructions</h3>
        <p id="instructions-text"></p>
      </section>
      <section id="detail-tags" hidden>
        <ul id="tags-list"></ul>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
